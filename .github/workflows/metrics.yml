# Gera os SVGs de métricas do perfil (lowlighter/metrics). Requer o secret METRICS_TOKEN.
name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]   # roda todo dia à meia-noite UTC
  workflow_dispatch:                 # permite rodar manualmente
  push: {branches: ["main", "master"]}
  
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Visão geral (cabeçalho, repositórios, commits, etc.)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.svg
          base: header, activity, community, repositories, metadata

      # Linguagens mais usadas
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # Calendário de contribuições (isométrico)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Hábitos de commit (horários, dias da semana)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

      # Contribuições notáveis em outros projetos
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.notable.svg
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes
